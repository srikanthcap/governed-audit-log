version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://audit_user:audit_pass@db:5432/governed_audit_db
      - PII_ENCRYPTION_KEY=gK4P1Xz8Z9R7W2Y6A3B5C8D1E4F7G0H3I6J9K2L5M8N=
      - ADMIN_API_KEY=admin-secret-key-123
      - AUDITOR_API_KEY=auditor-secret-key-456
      - SERVICE_API_KEY=service-secret-key-789
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
      POSTGRES_DB: governed_audit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d governed_audit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
