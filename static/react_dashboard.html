<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Governed Audit Log — Enterprise React Governance Portal</title>
  
  <!-- React 18 & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Google Fonts: Inter, Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome 6.5 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: rgba(255, 255, 255, 0.95);
      --card-border: rgba(15, 23, 42, 0.08);
      --card-border-glow: rgba(99, 102, 241, 0.25);
      --primary: #4f46e5;
      --primary-hover: #3730a3;
      --primary-glow: rgba(99, 102, 241, 0.15);
      --secondary: #0891b2;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-amber: #d97706;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --font-heading: 'Outfit', 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 40%),
        radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.04) 0px, transparent 40%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    #root { display: flex; flex-direction: column; min-height: 100vh; }

    /* Header Navigation Bar */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 2rem;
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: white; box-shadow: 0 0 20px var(--primary-glow);
    }
    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(90deg, #0f172a, #334155);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
    }
    .brand-subtitle { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .user-profile-badge {
      display: flex; align-items: center; gap: 0.75rem;
      background: rgba(15, 23, 42, 0.04); border: 1px solid var(--card-border);
      border-radius: 30px; padding: 0.4rem 1.1rem; font-size: 0.85rem;
    }
    
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      display: inline-block;
      margin-right: 4px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.6; transform: scale(0.95); }
    }

    /* Container & Layout */
    .container { max-width: 1440px; margin: 1.75rem auto; padding: 0 1.75rem; width: 100%; flex: 1; }

    /* KPI Summary Cards Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }

    .kpi-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      transition: all 0.3s ease;
    }

    .kpi-card:hover {
      border-color: var(--card-border-glow);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .kpi-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .kpi-purple { background: rgba(99, 102, 241, 0.08); color: #4f46e5; border: 1px solid rgba(99, 102, 241, 0.18); }
    .kpi-cyan { background: rgba(6, 182, 212, 0.08); color: #0891b2; border: 1px solid rgba(6, 182, 212, 0.18); }
    .kpi-green { background: rgba(16, 185, 129, 0.08); color: #16a34a; border: 1px solid rgba(16, 185, 129, 0.18); }
    .kpi-amber { background: rgba(245, 158, 11, 0.08); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.18); }

    .kpi-value { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    .kpi-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    /* Glass Cards */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 1.75rem;
      box-shadow: 0 12px 40px 0 rgba(15, 23, 42, 0.04);
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .card-title { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.65rem; }
    .card-title i { color: var(--primary); }

    /* Tabs Navigation */
    .tabs { display: flex; gap: 0.75rem; border-bottom: 1px solid var(--card-border); margin-bottom: 2rem; overflow-x: auto; padding-bottom: 2px; }
    .tab-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 0.85rem 1.4rem; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.6rem; border-bottom: 2px solid transparent;
      transition: all 0.25 ease; border-radius: 10px 10px 0 0; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text-main); background: rgba(15, 23, 42, 0.02); }
    .tab-btn.active {
      color: #4f46e5; border-bottom-color: var(--primary);
      background: rgba(99, 102, 241, 0.06);
    }

    /* Forms & Inputs */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.55rem; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .form-control {
      background: rgba(255, 255, 255, 0.9); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 0.8rem 1.1rem; color: var(--text-main); font-size: 0.92rem; outline: none;
      transition: all 0.2s ease;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    textarea.form-control { min-height: 110px; resize: vertical; font-family: var(--font-mono); font-size: 0.88rem; }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; border: none; border-radius: 10px; padding: 0.8rem 1.6rem;
      font-size: 0.92rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.6rem;
      transition: all 0.2s ease; box-shadow: 0 4px 16px 0 var(--primary-glow);
    }
    .btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 20px 0 var(--primary-glow); }
    .btn:active { transform: translateY(0); }
    .btn-secondary { background: rgba(15, 23, 42, 0.04); color: var(--text-main); box-shadow: none; border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: rgba(15, 23, 42, 0.08); border-color: rgba(15, 23, 42, 0.12); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 16px 0 rgba(16, 185, 129, 0.35); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 16px 0 rgba(239, 68, 68, 0.35); }

    .sample-pill {
      background: rgba(99, 102, 241, 0.06); border: 1px solid rgba(99, 102, 241, 0.2); color: #4f46e5;
      padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.78rem; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s ease;
    }
    .sample-pill:hover { background: rgba(99, 102, 241, 0.15); color: #3730a3; }

    /* Output Console */
    .output-box {
      background: #f1f5f9; border: 1px solid var(--card-border); border-radius: 12px;
      padding: 1.4rem; font-family: var(--font-mono); font-size: 0.85rem; color: #0284c7;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-top: 1.25rem;
      box-shadow: inset 0 2px 8px rgba(15, 23, 42, 0.03);
      position: relative;
    }

    /* Tables */
    .data-table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--card-border); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
    .data-table th { background: rgba(15, 23, 42, 0.02); color: var(--text-muted); padding: 0.95rem 1.1rem; font-weight: 600; border-bottom: 1px solid var(--card-border); }
    .data-table td { padding: 1.05rem 1.1rem; border-bottom: 1px solid rgba(15, 23, 42, 0.04); color: var(--text-main); }
    .data-table tr:hover { background: rgba(15, 23, 42, 0.015); }

    /* Badges */
    .tag { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .tag-admin { background: rgba(239, 68, 68, 0.1); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.2); }
    .tag-user { background: rgba(99, 102, 241, 0.08); color: #4f46e5; border: 1px solid rgba(99, 102, 241, 0.18); }
    .tag-approved { background: rgba(16, 185, 129, 0.08); color: #16a34a; border: 1px solid rgba(16, 185, 129, 0.18); }
    .tag-pending { background: rgba(245, 158, 11, 0.08); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.18); }

    /* Alert Banners */
    .alert-banner {
      background: rgba(245, 158, 11, 0.06); border: 1px solid rgba(245, 158, 11, 0.25); color: #b45309;
      padding: 1rem 1.25rem; border-radius: 14px; margin-bottom: 1.75rem; display: flex; align-items: center; gap: 0.85rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 1000;
      padding: 1rem 1.5rem; border-radius: 14px; display: flex; align-items: center; gap: 0.75rem;
      font-weight: 600; font-size: 0.9rem; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      animation: slideUp 0.3s ease;
    }
    .toast-success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .toast-error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

  </style>

  <script>
    window.onerror = function(msg, url, lineNo) {
      console.error('Portal Error:', msg, 'at line', lineNo);
      var errDiv = document.getElementById('globalErrorDisplay');
      if (errDiv) {
        errDiv.style.display = 'block';
        errDiv.innerText = 'Portal Error: ' + msg + ' (Line ' + lineNo + ')';
      }
      return false;
    };
  </script>
</head>
<body>

  <div id="globalErrorDisplay" style="display: none; background: #dc2626; color: white; padding: 1rem; text-align: center; font-weight: 600; z-index: 9999;"></div>
  <div id="root"></div>

  <!-- Standard Pure JavaScript React 18 Component Script -->
  <script>
    const { useState, useEffect, createElement: h } = React;

    function ReactGovernanceApp() {
      const [currentUser, setCurrentUser] = useState(function() {
        try { return JSON.parse(localStorage.getItem('governed_user')); } catch(e) { return null; }
      });
      const [token, setToken] = useState(localStorage.getItem('governed_token') || null);
      const [activeTab, setActiveTab] = useState(function() {
        try {
          const u = JSON.parse(localStorage.getItem('governed_user') || 'null');
          return (u && u.role === 'admin') ? 'usersTab' : 'ingestTab';
        } catch(e) { return 'ingestTab'; }
      });
      const [authMode, setAuthMode] = useState('login');
      const [authForm, setAuthForm] = useState({ username: '', email: '', password: '', role: 'user' });
      const [authMsg, setAuthMsg] = useState(null);

      const [usersList, setUsersList] = useState([]);
      const [ingestForm, setIngestForm] = useState({
        prompt: 'User email alice@example.com requested transfer for SSN 000-12-3456.',
        response: 'Processed account transfer for alice@example.com successfully.',
        agentId: 'finance-agent-01',
        userId: 'usr_alice_99',
        retentionCategory: 'FINANCIAL'
      });
      const [ingestOutput, setIngestOutput] = useState(null);
      const [verifyLogId, setVerifyLogId] = useState('');
      const [tamperOutput, setTamperOutput] = useState(null);
      const [accessLogs, setAccessLogs] = useState([]);
      const [dsarUserId, setDsarUserId] = useState('usr_alice_99');
      const [dsarOutput, setDsarOutput] = useState(null);
      const [toast, setToast] = useState(null);
      
      const [timeTravelDays, setTimeTravelDays] = useState(90);
      const [simResult, setSimResult] = useState(null);
      const [piiTokens, setPiiTokens] = useState([]);
      const [decryptResult, setDecryptResult] = useState(null);
      const [ingestMode, setIngestMode] = useState('manual');
      const [policiesList, setPoliciesList] = useState([]);
      const [newPolicyForm, setNewPolicyForm] = useState({ category: '', retentionDays: 30 });
      const [agentClassificationsList, setAgentClassificationsList] = useState([]);
      const [newAgentClassForm, setNewAgentClassForm] = useState({ agentId: '', regulatoryClassification: 'FINANCIAL' });

      const showToast = function(message, type) {
        setToast({ message: message, type: type || 'success' });
        setTimeout(function() { setToast(null); }, 4000);
      };

      useEffect(function() {
        fetchPoliciesList();
        if (currentUser && currentUser.role === 'admin') {
          fetchUsersList();
          fetchAgentClassifications();
        }
      }, [currentUser, activeTab]);

      const handleAuthSubmit = async function(e) {
        e.preventDefault();
        setAuthMsg({ type: 'info', text: 'Authenticating with security vault...' });

        const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(authForm)
          });
          const data = await res.json();

          if (res.ok) {
            if (authMode === 'login') {
              const userObj = { id: data.user_id, username: data.username, email: data.email, role: data.role, is_approved: data.is_approved };
              setCurrentUser(userObj);
              setToken(data.access_token);
              localStorage.setItem('governed_user', JSON.stringify(userObj));
              localStorage.setItem('governed_token', data.access_token);
              showToast('Welcome back, ' + data.username + '!', 'success');
              setActiveTab(data.role === 'admin' ? 'usersTab' : 'ingestTab');
            } else {
              setAuthMsg({ type: 'success', text: data.message });
              showToast(data.message, 'success');
              setAuthMode('login');
            }
          } else {
            setAuthMsg({ type: 'error', text: data.detail || 'Authentication failed' });
          }
        } catch (err) {
          setAuthMsg({ type: 'error', text: 'Network Error: ' + err.message });
        }
      };

      const handleLogout = function() {
        setCurrentUser(null);
        setToken(null);
        localStorage.removeItem('governed_user');
        localStorage.removeItem('governed_token');
        setActiveTab('ingestTab');
        showToast('Signed out successfully', 'success');
      };

      const getHeaders = function() {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        if (currentUser && currentUser.role === 'admin') headers['X-API-Key'] = 'admin-secret-key-123';
        else headers['X-API-Key'] = 'service-secret-key-789';
        return headers;
      };

      const fetchUsersList = async function() {
        try {
          const res = await fetch('/admin/users', { headers: getHeaders() });
          const data = await res.json();
          if (res.ok && Array.isArray(data)) setUsersList(data);
        } catch (err) { console.error('Error fetching users:', err); }
      };

      const toggleUserVerification = async function(userId, currentStatus) {
        try {
          const res = await fetch('/admin/users/' + userId + '/verify', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ is_approved: !currentStatus })
          });
          const data = await res.json();
          if (res.ok) {
            showToast('User ability status updated successfully!', 'success');
            fetchUsersList();
          } else { showToast('Verification failed: ' + data.detail, 'error'); }
        } catch (err) { showToast('Error: ' + err.message, 'error'); }
      };

      const fetchPoliciesList = async function() {
        try {
          const res = await fetch('/retention/policies', { headers: getHeaders() });
          const data = await res.json();
          if (res.ok && Array.isArray(data)) setPoliciesList(data);
        } catch (err) { console.error('Error fetching policies:', err); }
      };

      const handleUpsertPolicy = async function(e) {
        if (e) e.preventDefault();
        try {
          const res = await fetch('/retention/policies', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              category: newPolicyForm.category,
              retention_days: parseInt(newPolicyForm.retentionDays)
            })
          });
          const data = await res.json();
          if (res.ok) {
            showToast('Retention policy ' + data.category + ' upserted successfully!', 'success');
            setNewPolicyForm({ category: '', retentionDays: 30 });
            fetchPoliciesList();
          } else { showToast('Failed to save policy: ' + (data.detail || JSON.stringify(data)), 'error'); }
        } catch (err) { showToast('Error: ' + err.message, 'error'); }
      };

      const handleDeletePolicy = async function(category) {
        try {
          const res = await fetch('/retention/policies/' + category, {
            method: 'DELETE',
            headers: getHeaders()
          });
          const data = await res.json();
          if (res.ok) {
            showToast('Retention policy ' + category + ' deleted.', 'success');
            fetchPoliciesList();
          } else { showToast('Failed to delete policy: ' + (data.detail || JSON.stringify(data)), 'error'); }
        } catch (err) { showToast('Error: ' + err.message, 'error'); }
      };

      const fetchAgentClassifications = async function() {
        try {
          const res = await fetch('/admin/agent-classifications', { headers: getHeaders() });
          const data = await res.json();
          if (res.ok && Array.isArray(data)) setAgentClassificationsList(data);
        } catch (err) { console.error('Error fetching classifications:', err); }
      };

      const handleUpsertAgentClass = async function(e) {
        if (e) e.preventDefault();
        try {
          const res = await fetch('/admin/agent-classifications', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              agent_id: newAgentClassForm.agentId,
              regulatory_classification: newAgentClassForm.regulatoryClassification
            })
          });
          const data = await res.json();
          if (res.ok) {
            showToast('Agent classification updated successfully!', 'success');
            setNewAgentClassForm({ agentId: '', regulatoryClassification: 'FINANCIAL' });
            fetchAgentClassifications();
          } else { showToast('Failed to save agent classification: ' + (data.detail || JSON.stringify(data)), 'error'); }
        } catch (err) { showToast('Error: ' + err.message, 'error'); }
      };

      const handleDeleteAgentClass = async function(agentId) {
        try {
          const res = await fetch('/admin/agent-classifications/' + agentId, {
            method: 'DELETE',
            headers: getHeaders()
          });
          const data = await res.json();
          if (res.ok) {
            showToast('Agent classification deleted.', 'success');
            fetchAgentClassifications();
          } else { showToast('Failed to delete agent classification: ' + (data.detail || JSON.stringify(data)), 'error'); }
        } catch (err) { showToast('Error: ' + err.message, 'error'); }
      };

      const loadPresetSample = function(type) {
        if (type === 'financial') {
          setIngestForm({
            prompt: 'User email alice@example.com requested wire transfer for SSN 000-12-3456.',
            response: 'Processed wire transfer for account alice@example.com successfully.',
            agentId: 'finance-agent-01',
            userId: 'usr_alice_99',
            retentionCategory: 'FINANCIAL'
          });
        } else if (type === 'healthcare') {
          setIngestForm({
            prompt: 'Patient Dr. Bob (bob.smith@clinic.org) requesting medical records for Phone +1-555-019-2831.',
            response: 'Retrieved HIPAA encrypted lab test reports for bob.smith@clinic.org.',
            agentId: 'health-agent-04',
            userId: 'usr_bob_42',
            retentionCategory: 'HEALTHCARE'
          });
        } else {
          setIngestForm({
            prompt: 'HR employee charlie@corp.com updated salary details for SSN 999-88-7766.',
            response: 'Updated payroll ledger record for charlie@corp.com.',
            agentId: 'hr-agent-02',
            userId: 'usr_charlie_11',
            retentionCategory: 'GENERAL'
          });
        }
        showToast('Sample prompt loaded into form', 'success');
      };

      const handleIngest = async function(e) {
        e.preventDefault();
        setIngestOutput('Ingesting log & applying PII tokenization...');
        try {
          const res = await fetch('/logs/ingest', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              prompt: ingestForm.prompt,
              response: ingestForm.response,
              agent_id: ingestForm.agentId,
              user_id: ingestForm.userId,
              retention_category: ingestForm.retentionCategory
            })
          });

                ),
                h('div', { className: 'form-group' },
                  h('label', null, 'User ID'),
                  h('input', { type: 'text', className: 'form-control', value: ingestForm.userId, onChange: function(e) { setIngestForm(Object.assign({}, ingestForm, { userId: e.target.value })); }, required: true })
                ),
                h('div', { className: 'form-group' },
                  h('label', null, 'Retention Category Window'),
                  h('select', { className: 'form-control', value: ingestForm.retentionCategory, onChange: function(e) { setIngestForm(Object.assign({}, ingestForm, { retentionCategory: e.target.value })); } },
                    policiesList.map(function(p) {
                      return h('option', { key: p.category, value: p.category }, p.category + ' (' + p.retention_days + ' Days)');
                    })
                  )
                )
              ),
              h('div', { className: 'form-group', style: { marginBottom: '1.2rem' } },
                h('label', null, 'Raw Prompt Input (Contains PII like Email, SSN, Phone)'),
                h('textarea', { className: 'form-control', value: ingestForm.prompt, onChange: function(e) { setIngestForm(Object.assign({}, ingestForm, { prompt: e.target.value })); }, required: true })
              ),
              h('div', { className: 'form-group', style: { marginBottom: '1.4rem' } },
                h('label', null, 'Raw Agent Response Input'),
                h('textarea', { className: 'form-control', value: ingestForm.response, onChange: function(e) { setIngestForm(Object.assign({}, ingestForm, { response: e.target.value })); }, required: true })
              ),
              h('button', { type: 'submit', className: 'btn' },
                h('i', { className: 'fa-solid fa-paper-plane' }), ' Ingest & Tokenize PII Redaction'
              )
            ),
            ingestOutput ? h('div', { className: 'output-box' }, ingestOutput) : null,
            // Retention Time-Travel Simulator Card
            h('div', { style: { marginTop: '2rem', paddingTop: '1.5rem', borderTop: '1px solid var(--card-border)' } },
              h('div', { className: 'card-title', style: { fontSize: '1.1rem', marginBottom: '0.75rem' } },
                h('i', { className: 'fa-solid fa-clock-rotate-left' }), ' Time-Travel Retention Sweep Simulator'
              ),
              h('p', { style: { color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: '1rem' } }, 'Simulate days advancing into the future to test automatic retention policy expiration (FINANCIAL=90d, HEALTHCARE=365d, GENERAL=30d).'),
              h('div', { style: { display: 'flex', gap: '0.75rem', alignItems: 'center' } },
                h('button', { className: 'btn btn-secondary', onClick: function() { handleTimeTravel(30); }, style: { fontSize: '0.82rem' } }, 'Simulate +30 Days'),
                h('button', { className: 'btn btn-secondary', onClick: function() { handleTimeTravel(90); }, style: { fontSize: '0.82rem' } }, 'Simulate +90 Days'),
                h('button', { className: 'btn btn-secondary', onClick: function() { handleTimeTravel(365); }, style: { fontSize: '0.82rem' } }, 'Simulate +365 Days')
              ),
              simResult ? h('div', { className: 'output-box' }, simResult) : null
            )
          ) : null,

          // TAB 3: Tamper Verification
          (activeTab === 'tamperTab') ? h('div', { className: 'glass-card' },
            h('div', { className: 'card-header' },
              h('div', { className: 'card-title' }, h('i', { className: 'fa-solid fa-shield-cat' }), ' SHA-256 Tamper Verification Engine')
            ),
            h('p', { style: { color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '1.25rem' } }, 'Recomputes the canonical SHA-256 hash of stored audit records to detect any unauthorized database tampering.'),
            h('div', { className: 'form-group', style: { marginBottom: '1.25rem' } },
              h('label', null, 'Target Audit Record ID (UUID)'),
              h('input', { type: 'text', className: 'form-control', value: verifyLogId, onChange: function(e) { setVerifyLogId(e.target.value); }, placeholder: 'e.g. 8a93ef20-410a-49bf-a6cb-91829f001abc' })
            ),
            h('button', { className: 'btn', onClick: handleVerifyTamper },
              h('i', { className: 'fa-solid fa-check-double' }), ' Verify Canonical Hash Integrity'
            ),
            tamperOutput ? h('div', { className: 'output-box' }, tamperOutput) : null
          ) : null,

          // TAB 4: Access Audit Ledger & PII Decryption Vault (Admin)
          (activeTab === 'auditTab' && role === 'admin') ? h('div', { className: 'glass-card' },
            h('div', { className: 'card-header' },
              h('div', { className: 'card-title' }, h('i', { className: 'fa-solid fa-eye' }), ' Immutable Log Access Audit Ledger'),
              h('div', { style: { display: 'flex', gap: '0.5rem' } },
                h('button', { className: 'btn btn-secondary', onClick: fetchAccessLogs }, h('i', { className: 'fa-solid fa-rotate' }), ' Refresh Access Trail'),
                h('button', { className: 'btn btn-secondary', onClick: fetchPiiTokens }, h('i', { className: 'fa-solid fa-vault' }), ' Inspect PII Vault')
              )
            ),
            h('div', { className: 'data-table-container', style: { marginBottom: '2rem' } },
              h('table', { className: 'data-table' },
                h('thead', null,
                  h('tr', null,
                    h('th', null, 'Log ID'),
                    h('th', null, 'Accessor Role'),
                    h('th', null, 'Endpoint API'),
                    h('th', null, 'Query / Details'),
                    h('th', null, 'Access Timestamp (UTC)')
                  )
                ),
                h('tbody', null,
                  accessLogs.length === 0 ? h('tr', null, h('td', { colSpan: 5, style: { textAlign: 'center', color: 'var(--text-muted)', padding: '2rem' } }, 'No access logs recorded yet.')) :
                  accessLogs.map(function(l) {
                    return h('tr', { key: l.id },
                      h('td', { style: { fontFamily: 'var(--font-mono)', fontSize: '0.8rem' } }, '#' + l.id),
                      h('td', null, h('span', { className: 'tag tag-user' }, l.accessor_role)),
                      h('td', { style: { fontFamily: 'var(--font-mono)', fontSize: '0.8rem', color: '#0284c7' } }, l.endpoint),
                      h('td', { style: { fontSize: '0.82rem' } }, l.query_details || '-'),
                      h('td', { style: { fontSize: '0.82rem', color: 'var(--text-muted)' } }, new Date(l.accessed_at).toLocaleString())
                    );
                  })
                )
              )
            ),
            // PII Decryption Vault Section
            piiTokens.length > 0 ? h('div', { style: { paddingTop: '1.5rem', borderTop: '1px solid var(--card-border)' } },
              h('div', { className: 'card-title', style: { fontSize: '1.1rem', marginBottom: '0.75rem' } },
                h('i', { className: 'fa-solid fa-key' }), ' Encrypted PII Token Vault (Admin Access Only)'
              ),
              h('p', { style: { color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: '1rem' } }, 'Every AES-256 decryption event is automatically logged to the Immutable Access Audit Ledger.'),
              h('div', { className: 'data-table-container' },
                h('table', { className: 'data-table' },
                  h('thead', null,
                    h('tr', null,
                      h('th', null, 'Token Placeholder'),
                      h('th', null, 'User ID'),
                      h('th', null, 'Entity Type'),
                      h('th', null, 'Action')
                    )
                  ),
                  h('tbody', null,
                    piiTokens.map(function(t) {
                      return h('tr', { key: t.token },
                        h('td', { style: { fontFamily: 'var(--font-mono)', fontSize: '0.82rem', color: '#4f46e5' } }, t.token),
                        h('td', null, t.user_id),
                        h('td', null, h('span', { className: 'tag tag-admin' }, t.entity_type)),
                        h('td', null,
                          h('button', { className: 'btn btn-secondary', style: { padding: '0.3rem 0.65rem', fontSize: '0.78rem' }, onClick: function() { handleDecryptToken(t.token); } },
                            h('i', { className: 'fa-solid fa-unlock' }), ' Decrypt (Audit Logged)'
                          )
                        )
                      );
                    })
                  )
                )
              ),
              decryptResult ? h('div', { className: 'output-box' }, decryptResult) : null
            ) : null
          ) : null,

          // TAB 5: DSAR Subject Portal
          (activeTab === 'dsarTab') ? h('div', { className: 'glass-card' },
            h('div', { className: 'card-header' },
              h('div', { className: 'card-title' }, h('i', { className: 'fa-solid fa-id-card' }), ' Data Subject Access Request (DSAR) Portal')
            ),
            h('p', { style: { color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '1.25rem' } }, 'Execute GDPR/CCPA Data Subject Access Requests (DSAR) to audit or permanently sanitize user PII mappings.'),
            h('div', { className: 'form-group', style: { marginBottom: '1.25rem' } },
              h('label', null, 'Target User ID'),
              h('input', { type: 'text', className: 'form-control', value: dsarUserId, onChange: function(e) { setDsarUserId(e.target.value); }, placeholder: 'e.g. usr_alice_99' })
            ),
            h('div', { style: { display: 'flex', gap: '0.85rem' } },
              h('button', { className: 'btn', onClick: function() { handleDSAR('report'); } }, h('i', { className: 'fa-solid fa-magnifying-glass' }), ' Generate DSAR Summary Report'),
              h('button', { className: 'btn btn-danger', onClick: function() { handleDSAR('delete'); } }, h('i', { className: 'fa-solid fa-trash-can' }), ' Request Right-to-Be-Forgotten Deletion')
            ),
            dsarOutput ? h('div', { className: 'output-box' }, dsarOutput) : null
          ) : null
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(ReactGovernanceApp));
  </script>
</body>
</html>
